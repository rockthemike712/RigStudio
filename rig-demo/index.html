<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rig Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a studio — script on the left, stage in the middle, control deck on the right (stacks on phones). */
  :root {
    --bg:#111216; --panel:#17181d; --raised:#1f2127; --line:#2b2d35; --text:#e3e4e8; --dim:#8a8d97;
    --accent:#ffc23d; --accent-ink:#1a1405; --rec:#ff6464; --hl:rgba(255,194,61,.16);
    --sans:'Inter', ui-sans-serif, system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 var(--sans); }
  #app { height:100%; display:grid; grid-template-rows:auto 1fr; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px; gap:10px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  header h1 { font-size:15px; font-weight:600; margin:0 10px 0 0; letter-spacing:.01em; }
  header h1 span { color:var(--accent); }
  button, select, input[type=number] { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:7px; padding:6px 11px; }
  button { cursor:pointer; }
  button:hover { border-color:#43464f; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, canvas:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  input[type=number] { width:62px; padding:6px 8px; }
  .lbl { color:var(--dim); font-size:12px; }
  #scrub { flex:1 1 160px; min-width:120px; accent-color:var(--accent); }
  #clock { font:12px var(--mono); color:var(--dim); min-width:150px; font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:minmax(260px, 30%) minmax(0, 1fr) 330px; gap:10px; min-height:0; }
  .pane { background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .pane-h { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; display:flex; justify-content:space-between; gap:8px; }
  #editorWrap { position:relative; flex:1; overflow:hidden; }
  #hl { position:absolute; left:0; right:0; height:18px; background:var(--hl); border-left:3px solid var(--accent); pointer-events:none; }
  #code { position:absolute; inset:0; width:100%; height:100%; resize:none; border:0; outline:0; background:transparent; color:var(--text);
          font:12px/18px var(--mono); padding:10px 12px; white-space:pre; tab-size:2; overflow:auto; }
  #err { color:var(--rec); padding:6px 12px; font:11.5px var(--mono); min-height:28px; border-top:1px solid var(--line); }
  #stage { display:flex; align-items:center; justify-content:center; padding:0; background:transparent; border:0; }
  #cv { width:100%; max-width:100%; max-height:100%; aspect-ratio:16/9; border-radius:10px; border:1px solid var(--line); }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:transparent; color:var(--dim); padding:9px 4px; border-bottom:2px solid transparent; }
  .tabs button[aria-selected=true] { color:var(--text); border-bottom-color:var(--accent); }
  .tabbody { flex:1; overflow:auto; padding:10px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .tile { padding:0; border-radius:8px; overflow:hidden; background:var(--raised); display:flex; flex-direction:column; text-align:left; }
  .tile canvas { width:100%; max-width:100%; aspect-ratio:300/216; display:block; }
  .tile span { padding:5px 8px; font-size:12px; color:var(--dim); }
  .tile[aria-pressed=true] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tile[aria-pressed=true] span { color:var(--text); }
  .tile.import { justify-content:center; align-items:center; min-height:96px; border-style:dashed; }
  fieldset { border:0; padding:0; margin:0 0 14px; display:grid; gap:6px; }
  legend { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
  .sl { display:grid; grid-template-columns:96px minmax(0, 1fr) 44px; align-items:center; gap:8px; font-size:12px; }
  .sl input { width:100%; accent-color:var(--accent); }
  .sl output { font:11px var(--mono); color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
  #deck { border-top:1px solid var(--line); padding:10px; display:grid; gap:8px; }
  #mode { font-size:12px; color:var(--dim); }
  #mode b { color:var(--text); font-weight:600; }
  #mode.rec b { color:var(--rec); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { flex:1; }
  @media (max-width: 1100px) { main { grid-template-columns:minmax(0, 1fr) 320px; } #scriptPane { grid-column:1 / -1; grid-row:2; min-height:300px; } }
  @media (max-width: 720px) {
    html, body { height:auto; }
    #app { height:auto; }
    main { grid-template-columns:minmax(0, 1fr); }
    #stage { order:1; } #panelPane { order:2; min-height:420px; }
    #scriptPane { order:3; grid-column:auto; grid-row:auto; min-height:320px; }
    #clock { min-width:0; }
  }
  @media (prefers-reduced-motion: reduce) { #hl { transition:none; } }
</style>

<div id="app">
  <header>
    <h1>Rig <span>Studio</span></h1>
    <button id="play" class="primary">Play</button>
    <button id="restart" aria-label="Back to start">⟲</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="clock">bar 1 · beat 1</span>
    <label class="lbl" for="bpm">BPM</label><input id="bpm" type="number" value="100" min="30" max="240">
    <label class="lbl" for="bpb">Beats/bar</label><input id="bpb" type="number" value="4" min="1" max="12">
    <input id="audioFile" type="file" accept="audio/*,video/mp4,video/quicktime,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.mp4,.mov,.webm" hidden>
    <button id="loadSong">Load song</button>
    <input id="svgFile" type="file" accept=".svg,image/svg+xml" hidden>
  </header>
  <main>
    <section class="pane" id="scriptPane">
      <div class="pane-h"><span>Script</span><span>edits apply live</span></div>
      <div id="editorWrap"><div id="hl"></div><textarea id="code" spellcheck="false" aria-label="Animation script"></textarea></div>
      <div id="err"></div>
    </section>
    <section class="pane" id="stage"><canvas id="cv" width="1920" height="1080" aria-label="Character stage"></canvas></section>
    <section class="pane" id="panelPane">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="character" aria-selected="true">Character</button>
        <button role="tab" data-tab="style" aria-selected="false">Style</button>
        <button role="tab" data-tab="pose" aria-selected="false">Pose</button>
        <button role="tab" data-tab="design" aria-selected="false">Design</button>
      </div>
      <div class="tabbody" id="tabbody"></div>
      <div id="deck">
        <div id="mode"></div>
        <div class="row" id="liveBtns" hidden>
          <button id="addBtn" class="primary">Add to script</button>
          <button id="discardBtn">Back to script</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* =====================================================================
   RIG ENGINE
   Everything is a pure function of time:  frame = render(score, t)
   - CHARACTER: a parametric rig (numbers only, so anything can tween)
   - POSES:     named partial parameter sets
   - STYLES:    renderers that draw the same rig geometry differently
   - SCORE:     musical-time events { at:[bar, beat], ... } compiled to keyframes
   ===================================================================== */

const BASE = {
  bx:0, by:0, tilt:0, squash:1, zoom:1, camX:0, bounce:0,
  eyeOpen:1, eyeSize:20, eyeGap:48, lookX:0, lookY:0,
  browY:-78, browInner:0, browTilt:0, browW:1,
  mouthW:30, mouthCurve:8, mouthOpen:0, mouthY:18,
  lhX:-160, lhY:70, lhR:0, rhX:160, rhY:70, rhR:0, wave:0,
  // extra channels some characters use (others just ignore them)
  earL:0, earR:0, tailWag:1, tongue:0,
};

const POSES = {
  neutral:   {},
  smiling:   { mouthCurve:16, mouthW:36, eyeOpen:.85, browY:-82, tailWag:1.6, tongue:.6 },
  waving:    { mouthCurve:14, rhX:175, rhY:-70, rhR:-20, wave:1, tilt:-3, earR:-10, tailWag:2 },
  thinking:  { lookX:9, lookY:-7, browTilt:10, mouthCurve:-2, mouthW:18, rhX:55, rhY:95, rhR:-35, tilt:4, earL:-14, earR:18, tailWag:.3 },
  laughing:  { eyeOpen:.18, mouthOpen:26, mouthCurve:16, mouthW:40, browY:-90, bounce:10, lhY:40, rhY:40, tongue:1, tailWag:2.5, earL:10, earR:-10 },
  suspicious:{ eyeOpen:.38, lookX:-10, browInner:10, browTilt:-6, mouthCurve:-4, mouthW:20, tilt:-5, bx:-15, earL:-18, earR:8, tailWag:0 },
  furious:   { eyeOpen:.7, eyeSize:17, browInner:22, browY:-70, mouthCurve:-12, mouthOpen:8, squash:.94, lhY:110, rhY:110, lhR:20, rhR:-20, earL:-30, earR:30, tailWag:0 },
  surprised: { eyeOpen:1.35, eyeSize:23, browY:-102, mouthOpen:22, mouthW:16, mouthCurve:0, squash:1.06, lhX:-175, lhY:-10, rhX:175, rhY:-10, earL:10, earR:-10 },
  sad:       { lookY:6, browInner:-14, browY:-74, mouthCurve:-14, mouthW:24, squash:.96, lhY:120, rhY:120, earL:-45, earR:45, tailWag:0 },
  happy:     { eyeOpen:.85, mouthOpen:13, mouthCurve:16, mouthW:34, browY:-84, tongue:1, tailWag:2.2, earL:4, earR:-4 },
  sleepy:    { eyeOpen:.12, browY:-72, mouthCurve:2, mouthW:14, tilt:8, squash:.97, lhY:120, rhY:120, earL:-30, earR:30, tailWag:.15 },
};

const allFills = color => ({ body: color, side: color, dark: color, eyeWhite: color, hand: color, fur: color, white: color, pink: color, iris: color });
const STYLES = {
  pencil:    { bg:'#efede6', ink:'rgba(38,38,44,.82)', w:2.3, jitter:2.4, passes:2, guides:'rgba(70,115,205,.32)', shadow:'rgba(0,0,0,.10)',
               fills:{ dark:'rgba(38,38,44,.85)', eyeWhite:'#efede6', iris:'rgba(38,38,44,.7)', fur:'BG', white:'BG', pink:'rgba(38,38,44,.12)' } },
  blueprint: { bg:'#eef0ef', ink:'rgba(52,128,214,.9)', w:2, jitter:1.8, passes:3, guides:'rgba(52,128,214,.32)', shadow:'rgba(0,0,0,.10)',
               fills:{ dark:'rgba(52,128,214,.9)', eyeWhite:'#eef0ef', iris:'rgba(52,128,214,.7)', fur:'BG', white:'BG', pink:'rgba(52,128,214,.15)' } },
  ink:       { bg:'#fbfaf7', ink:'#141414', w:7, jitter:0, passes:1, shadow:'rgba(0,0,0,.16)',
               fills:{ body:'#ffffff', side:'#e9e7e1', dark:'#141414', eyeWhite:'#ffffff', hand:'#ffffff', iris:'#6b3a1a', fur:'#e0843a', white:'#ffffff', pink:'#f48aa0' } },
  hologram:  { bg:'#05060b', ink:'#ff4fd8', w:3, jitter:.5, passes:1, glow:28, holo:true,
               fills:{ dark:'INK', eyeWhite:'#05060b', iris:'INK', fur:'BG', white:'BG', pink:'BG' } },
  lineart:   { bg:'#f2eee6', ink:'#161514', w:2.5, jitter:.5, passes:1, shadow:'rgba(0,0,0,.07)',
               fills:{ dark:'#161514', eyeWhite:'#f2eee6', iris:'#161514', fur:'BG', white:'BG', pink:'BG', body:'BG', side:'BG', hand:'BG' } },
  comic:     { bg:'#fff3c4', bgDots:'rgba(240,150,40,.22)', bgDotSize:18, ink:'#111111', w:6.5, jitter:0, passes:1, shadow:'rgba(0,0,0,.18)',
               fills:{ body:'#ffffff', side:{ base:'#e8dfc8', dots:'rgba(0,0,0,.28)', size:9 }, dark:'#111111', eyeWhite:'#ffffff', hand:'#ffffff', iris:'#3b2412',
                       fur:{ base:'#f08a2c', dots:'rgba(160,30,0,.45)', size:10 }, white:'#fffdf5', pink:'#ff7fa0' } },
  riso:      { bg:'#f3eee4', ink:'#ff48b0', w:3, jitter:.8, passes:1, grain:.22, shadow:'#ffbfe2',
               // each ink is printed as its own sheet (opaque within itself), then multiplied onto the paper
               layers:[
                 { comp:'multiply', fills:{ ...allFills('#ffffff'), fur:'#ffa6d6', pink:'#ff62bb', dark:'#ff48b0', iris:'#ff48b0', body:'#ffd3ea', hand:'#ffc0e2' } },
                 { comp:'multiply', offset:[9, 5], ink:'#0078bf', shadow:null,
                   fills:{ ...allFills('#ffffff'), fur:{ base:'#ffffff', dots:'#0078bf', size:9 }, dark:'#0078bf', iris:'#0078bf',
                           side:{ base:'#ffffff', dots:'#0078bf', size:9 }, white:{ base:'#ffffff', dots:'rgba(0,120,191,.25)', size:9 } } } ] },
  sticker:   { bg:'#dfe7ec', ink:'#1d1d1f', w:5, jitter:0, passes:1, shadow:null,
               fills:{ body:'#ffffff', side:'#d8dde2', dark:'#1d1d1f', eyeWhite:'#ffffff', hand:'#ffd23a', iris:'#4a2b14', fur:'#ef8a35', white:'#ffffff', pink:'#ff8fab' },
               layers:[ { ink:'#ffffff', w:34, fills:allFills('#ffffff'), shapeShadow:'rgba(20,40,60,.35)' }, {} ] },
  chalk:     { bg:'#25332c', ink:'rgba(240,240,226,.82)', w:2.6, jitter:2.6, passes:3, shadow:'rgba(0,0,0,.25)',
               fills:{ dark:'rgba(240,240,226,.85)', iris:'rgba(240,240,226,.85)', eyeWhite:'#25332c', fur:{ base:'#25332c', scribble:'rgba(246,168,104,.42)' },
                       white:{ base:'#25332c', scribble:'rgba(240,240,226,.28)' }, pink:{ scribble:'rgba(255,160,182,.5)' }, body:{ base:'#25332c', scribble:'rgba(240,240,226,.16)' },
                       side:{ base:'#25332c', scribble:'rgba(240,240,226,.1)' }, hand:{ base:'#25332c', scribble:'rgba(240,226,140,.4)' } } },
  pixel:     { bg:'#9bbc0f', ink:'#0f380f', w:5, jitter:0, passes:1, pixel:11, shadow:'rgba(15,56,15,.25)',
               fills:{ body:'#8bac0f', side:'#306230', dark:'#0f380f', eyeWhite:'#8bac0f', hand:'#8bac0f', iris:'#0f380f', fur:'#306230', white:'#8bac0f', pink:'#306230' } },
  crayon:    { bg:'#fbf8f0', ink:'#3a2a1e', w:3.2, jitter:2, passes:2, grain:.14, shadow:'rgba(0,0,0,.08)',
               fills:{ dark:'#3a2a1e', iris:'#3a2a1e', eyeWhite:'#fbf8f0', fur:{ base:'#fbf8f0', scribble:'rgba(234,118,38,.85)' }, white:{ base:'#fbf8f0', scribble:'rgba(190,190,176,.3)' },
                       pink:{ scribble:'rgba(240,108,140,.85)' }, body:{ base:'#fbf8f0', scribble:'rgba(100,165,230,.75)' }, side:{ base:'#fbf8f0', scribble:'rgba(55,105,180,.75)' },
                       hand:{ base:'#fbf8f0', scribble:'rgba(240,196,80,.85)' } } },
  newsprint: { bg:'#ebe5d6', ink:'#1b1b1b', w:3, jitter:.6, passes:1, grain:.3, shadow:'rgba(0,0,0,.12)',
               fills:{ dark:'#1b1b1b', iris:'#1b1b1b', eyeWhite:'#ebe5d6', fur:{ base:'#ebe5d6', dots:'rgba(20,20,20,.62)', size:8 }, white:'#ebe5d6',
                       pink:{ base:'#ebe5d6', dots:'rgba(20,20,20,.28)', size:8 }, body:{ base:'#ebe5d6', dots:'rgba(20,20,20,.18)', size:8 },
                       side:{ base:'#ebe5d6', dots:'rgba(20,20,20,.5)', size:8 }, hand:'#ebe5d6' } },
  cutpaper:  { bg:'#e7dfcd', ink:'#2a2520', w:1.6, jitter:1.4, passes:1, grain:.12, shapeShadow:'rgba(70,45,20,.4)', shadow:'rgba(70,45,20,.18)',
               fills:{ body:'#5aa1c9', side:'#3f7fa6', dark:'#2a2520', eyeWhite:'#fbf7ee', hand:'#f2c14e', iris:'#2a2520', fur:'#d9692b', white:'#fbf7ee', pink:'#f19aa8' } },
  pixelwind: { bg:'#f1efe9', ink:'#222222', w:2.4, jitter:1.6, passes:2, post:'pixelwind', shadow:'rgba(0,0,0,.1)',
               fills:{ dark:'#222222', iris:'#222222', eyeWhite:'#f1efe9', fur:'#efc39c', white:'#f6f3ec', pink:'#f2b7c4', body:'#f1efe9', side:'#dcd7cb', hand:'#f1efe9' } },
  pop:       { bg:'#ffffff', bgFx:'rays', ink:'#111111', w:3, jitter:.6, passes:1, shadow:'rgba(236,0,140,.25)',
               layers:[
                 { comp:'multiply', ink:'#00aeef', fills:{ ...allFills('#ffffff'), body:'#00aeef', side:'#00aeef', iris:'#00aeef', dark:'#00aeef' } },
                 { comp:'multiply', ink:'#ec008c', offset:[8, -5], shadow:null, fills:{ ...allFills('#ffffff'), fur:'#ec008c', side:{ base:'#ffffff', dots:'#ec008c', size:11 }, pink:'#ec008c', hand:'#ec008c', dark:'#ec008c' } },
                 { comp:'multiply', ink:'#ffd400', offset:[-6, 6], shadow:null, fills:{ ...allFills('#ffffff'), white:'#ffd400', body:{ base:'#ffffff', dots:'#ffd400', size:11 }, hand:'#ffd400', fur:{ base:'#ffffff', dots:'#ffd400', size:11 } } },
                 { shadow:null, w:3.2, fills:{ dark:'#111111', iris:'#111111' } } ] },
  foil:      { bg:'#15121d', ink:'#fbeefe', w:2.4, jitter:.3, passes:1, glow:10, post:'sparkle', shadow:'rgba(255,190,230,.12)',
               fills:{ fur:{ foil:true, hue:330 }, body:{ foil:true, hue:180 }, side:{ foil:true, hue:220, light:66 }, white:{ foil:true, hue:40, light:86 }, pink:{ foil:true, hue:300 },
                       hand:{ foil:true, hue:50 }, dark:'#15121d', eyeWhite:'#fbeefe', iris:'#15121d' } },
  rgb:       { bg:'#07080c', ink:'#e6f4ff', w:2.6, jitter:.4, passes:1, post:'rgb', shadow:'rgba(120,200,255,.12)',
               fills:{ fur:'#1b2740', body:'#1b2740', side:'#101828', white:'#2c3958', hand:'#2c3958', pink:'#ff2a6d', dark:'#e6f4ff', eyeWhite:'#07080c', iris:'#e6f4ff' } },
  vhs:       { bg:'#cfc7b3', ink:'#1d1b19', w:4, jitter:.6, passes:1, post:'vhs', shadow:'rgba(0,0,0,.18)',
               fills:{ body:'#f6f2ea', side:'#cfc6b2', dark:'#1d1b19', eyeWhite:'#ffffff', hand:'#f2c14e', iris:'#4a2b14', fur:'#e0843a', white:'#fbf8f2', pink:'#f48aa0' } },
  acid:      { bg:'#000000', bgFx:'rings', ink:'#111111', w:7, jitter:1.2, passes:1, post:'wobble', shadow:'rgba(0,0,0,.35)',
               fills:{ fur:{ rainbow:true }, body:{ rainbow:true, hue:120 }, side:{ rainbow:true, hue:240 }, hand:{ rainbow:true, hue:60 },
                       white:'#ffffff', pink:'#ff5fd2', dark:'#111111', eyeWhite:'#ffffff', iris:'#111111' } },
  static:    { bg:'#f4f2ee', ink:'#151515', w:3.4, jitter:1, passes:1, shadow:'rgba(0,0,0,.12)',
               fills:{ fur:{ noise:'rainbow' }, body:{ noise:'rainbow' }, side:{ noise:'rainbow' }, hand:{ noise:'rainbow' }, white:{ noise:'bw' }, pink:{ noise:'pink' },
                       dark:'#151515', eyeWhite:'#ffffff', iris:'#151515' } },
  paint:     { bg:'#f4efe4', ink:'#2b2118', w:4, jitter:1.1, passes:1, shadow:'rgba(60,40,20,.2)',
               fills:{ body:'PAINT', side:'rgba(60,90,60,.55)', dark:'#2b2118', eyeWhite:'#fff8ea', hand:'#e8a93a', iris:'#6b3a1a', fur:'PAINT_WARM', white:'#fff8ea', pink:'#e86a7e' } },
};
// 'BG' = paint with the background colour, so sketch styles still hide lines that are behind a shape

const DEFAULT_SCORE = `[
  // bar 1 — the engine reads this like sheet music
  { at: [1, 1], character: 'hashbrown', style: 'lineart', pose: 'happy' },
  { at: [1, 3], pose: 'waving' },
  { at: [2, 1], pose: 'smiling', talk: 2 },
  { at: [2, 3], style: 'pencil' },
  { at: [2, 3], set: { lookX: 9, lookY: -5 } },
  // bar 3
  { at: [3, 1], pose: 'thinking' },
  { at: [3, 3], style: 'blueprint' },
  { at: [4, 1], pose: 'laughing' },
  { at: [4, 3], style: 'ink' },
  // bar 5
  { at: [5, 1], pose: 'suspicious' },
  { at: [5, 3], pose: 'furious' },
  { at: [6, 1], style: 'hologram', color: '#ff4fd8', pose: 'surprised' },
  { at: [6, 3], style: 'hologram', color: '#39f3ff' },
  { at: [6, 4], style: 'hologram', color: '#ffd23a' },
  // bar 7
  { at: [7, 1], style: 'paint', pose: 'smiling', talk: 4 },
  { at: [8, 1], pose: 'sad' },
  { at: [8, 3], set: { eyeOpen: 0.5, browInner: -20 } },
  { at: [9, 1], style: 'pencil', pose: 'sleepy' },
  // same score, different character — one line
  { at: [10, 1], character: 'fridge', pose: 'waving' },
  { at: [10, 3], character: 'hashbrown' },
  { at: [11, 1], character: 'fridge' },
]`;

/* ---------- geometry helpers (everything becomes polylines) ---------- */

let live = null, liveP = null, liveBase = null, tab = 'character', offline = false;

const STYLE_SWATCHES = [
  { label:'Line art', style:'lineart' }, { label:'Pencil', style:'pencil' }, { label:'Blueprint', style:'blueprint' }, { label:'Ink', style:'ink' }, { label:'Paint', style:'paint' },
  { label:'Hologram pink', style:'hologram', color:'#ff4fd8' }, { label:'Hologram cyan', style:'hologram', color:'#39f3ff' },
  { label:'Hologram gold', style:'hologram', color:'#ffd23a' }, { label:'Hologram green', style:'hologram', color:'#59ff8a' },
  { label:'Comic', style:'comic' }, { label:'Risograph', style:'riso' }, { label:'Sticker', style:'sticker' }, { label:'Chalkboard', style:'chalk' },
  { label:'8-bit', style:'pixel' }, { label:'Crayon', style:'crayon' }, { label:'Newsprint', style:'newsprint' }, { label:'Cut paper', style:'cutpaper' },
  { label:'Pixel wind', style:'pixelwind' }, { label:'Pop burst', style:'pop' }, { label:'Holo foil', style:'foil' }, { label:'RGB glitch', style:'rgb' },
  { label:'VHS', style:'vhs' }, { label:'Acid trip', style:'acid' }, { label:'Colour static', style:'static' },
];
const SLIDERS = {
  Body:  [['squash','Squash', .8, 1.2, .01], ['tilt','Lean', -20, 20, .5], ['bounce','Bounce', 0, 20, .5], ['bx','Slide', -150, 150, 1], ['zoom','Camera zoom', .6, 1.6, .01]],
  Eyes:  [['eyeOpen','Open', 0, 1.5, .01], ['eyeSize','Size', 10, 30, .5], ['eyeGap','Spacing', 30, 70, .5], ['lookX','Look ↔', -12, 12, .5], ['lookY','Look ↕', -10, 10, .5]],
  Brows: [['browY','Height', -110, -60, .5], ['browInner','Angry ↔ worried', -25, 25, .5], ['browTilt','Quizzical', -15, 15, .5], ['browW','Weight', .5, 2, .05]],
  Mouth: [['mouthW','Width', 8, 50, .5], ['mouthCurve','Smile', -20, 20, .5], ['mouthOpen','Open', 0, 30, .5]],
  'Arms / paws': [['lhY','Left height', -80, 130, 1], ['rhY','Right height', -80, 130, 1], ['wave','Wave', 0, 1.5, .05]],
  'Ears & tail': [['earL','Left ear', -50, 30, .5], ['earR','Right ear', -30, 50, .5], ['tailWag','Tail wag', 0, 3, .05], ['tongue','Tongue', 0, 1, .01]],
};
const LABELS = { fridge:'Fridge', hashbrown:'Hashbrown' };
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ----- script ----- */
function rebuild() {
  try {
    const score = new Function(`return (${code.value});`)();
    C = compile(score, +bpmEl.value || 100, +bpbEl.value || 4);
    lineOf = []; code.value.split('\n').forEach((l, n) => { if (/\bat\s*:/.test(l) && !/^\s*\/\//.test(l)) lineOf.push(n); });
    err.textContent = '';
  } catch (e) { err.textContent = e.message; }
}
const spb = () => 60 / (+bpmEl.value || 100), bpb = () => +bpbEl.value || 4;
function barBeat(t, step) { const q = Math.round(t / spb() / step) * step, bar = Math.floor(q / bpb()) + 1; return [bar, +(q - (bar - 1) * bpb() + 1).toFixed(2)]; }
const fmtVal = v => typeof v === 'string' ? `'${v}'` : +(+v).toFixed(2);
function fmtEvent(at, ev) {
  const parts = [`at: [${at[0]}, ${at[1]}]`];
  for (const k of ['character', 'style', 'color', 'pose']) if (ev[k] != null) parts.push(`${k}: ${fmtVal(ev[k])}`);
  if (ev.set && Object.keys(ev.set).length) parts.push(`set: { ${Object.entries(ev.set).map(([k, v]) => `${k}: ${fmtVal(v)}`).join(', ')} }`);
  return `{ ${parts.join(', ')} },`;
}
function insertEvent(at, ev) {
  const line = fmtEvent(at, ev), s = code.value, end = s.lastIndexOf(']');
  let head = s.slice(0, end).replace(/\s*$/, ''); if (!/[\[,]$/.test(head)) head += ',';
  code.value = `${head}\n  ${line}\n${s.slice(end)}`;
  rebuild(); code.scrollTop = code.scrollHeight;
}

/* ----- time ----- */
const now = () => !playing ? tPaused : hasAudio && song.src ? songTime() : performance.now() / 1000 - t0;
function seek(t) { t = Math.max(0, t); if (hasAudio && playing) songPlay(t); t0 = performance.now() / 1000 - t; tPaused = t; }
function setPlaying(p) {
  const cur = now(); playing = p; playBtn.textContent = p ? 'Pause' : 'Play';
  if (p) { live = null; seek(tPaused); } else { tPaused = cur; songStop(); }
  updateMode();
}

/* ----- live puppeting ----- */
function enterLive() {
  if (live) return;
  const e = evaluate(C, now());
  live = { character: e.who, style: e.styleName, color: e.S.color, pose: e.pose, set: {} };
  liveBase = { ...live }; liveP = { ...e.P };
}
function act(change, commit = true) {
  if (playing) {                       // performing: every click lands in the script on the nearest half-beat
    if (!commit) return;
    insertEvent(barBeat(now(), .5), change); flashMode(); return;
  }
  enterLive();
  if (change.character) live.character = change.character;
  if (change.style) { live.style = change.style; live.color = change.color || null; }
  if (change.pose) { live.pose = change.pose; live.set = {}; }
  if (change.set) live.set = { ...live.set, ...change.set };
  updateMode(); refreshThumbs(true);
}
function liveDiff() {
  const d = {};
  if (live.character !== liveBase.character) d.character = live.character;
  if (live.style !== liveBase.style || live.color !== liveBase.color) { d.style = live.style; if (live.color) d.color = live.color; }
  if (live.pose !== liveBase.pose) d.pose = live.pose;
  if (Object.keys(live.set).length) d.set = live.set;
  return d;
}
addBtn.onclick = () => {
  const d = liveDiff(); if (!Object.keys(d).length) return;
  insertEvent(barBeat(now(), 1), d); live = null; updateMode();
};
$('discardBtn').onclick = () => { live = null; updateMode(); refreshThumbs(true); };
let flashUntil = 0;
function flashMode() { flashUntil = performance.now() + 700; updateMode(); setTimeout(updateMode, 720); }
function updateMode() {
  const at = barBeat(now(), playing ? .5 : 1);
  modeEl.className = playing ? 'rec' : '';
  if (playing) modeEl.innerHTML = performance.now() < flashUntil ? `<b>● Recorded</b> at bar ${at[0]}, beat ${at[1]}` : `<b>● Performing</b> · clicks are written into the script on the beat`;
  else if (live) modeEl.innerHTML = `<b>Previewing</b> · not in the script yet`;
  else modeEl.innerHTML = `<b>Paused</b> at bar ${at[0]}, beat ${at[1]} · click anything to preview it`;
  liveBtns.hidden = !live;
  if (live) addBtn.textContent = `Add at bar ${at[0]}, beat ${at[1]}`;
}

/* ----- panels ----- */
function look() { // what's on stage right now
  if (live) return { who: live.character, style: live.style, color: live.color, pose: live.pose };
  const e = evaluate(C, now()); return { who: e.who, style: e.styleName, color: e.S.color, pose: e.pose };
}
function tiles(items) {
  tabbody.innerHTML = `<div class="grid">${items.map((it, i) => `<button class="tile" data-i="${i}" aria-pressed="false"><canvas width="300" height="216"></canvas><span>${it.label}</span></button>`).join('')}</div>`;
  tabbody.querySelectorAll('.tile[data-i]').forEach(b => b.onclick = () => act(items[+b.dataset.i].change));
}
let tabItems = [], thumbKey = '';
function buildTab() {
  document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (tab === 'character') tabItems = Object.keys(CHARACTERS).map(c => ({ label: LABELS[c] || cap(c), change: { character: c } }));
  if (tab === 'style') tabItems = STYLE_SWATCHES.map(s => ({ label: s.label, change: { style: s.style, ...(s.color ? { color: s.color } : {}) } }));
  if (tab === 'pose') tabItems = Object.keys(POSES).map(p => ({ label: cap(p), change: { pose: p } }));
  if (tab === 'design') {
    tabItems = [];
    tabbody.innerHTML = Object.entries(SLIDERS).map(([g, list]) => `<fieldset><legend>${g}</legend>${list.map(([k, l, a, b, st]) =>
      `<label class="sl"><span>${l}</span><input type="range" id="sl-${k}" data-k="${k}" min="${a}" max="${b}" step="${st}"><output id="o-${k}"></output></label>`).join('')}</fieldset>`).join('');
    tabbody.querySelectorAll('input[type=range]').forEach(r => {
      r.oninput = () => { $('o-' + r.dataset.k).textContent = (+r.value).toFixed(2); act({ set: { [r.dataset.k]: +r.value } }, false); };
      r.onchange = () => { if (playing) act({ set: { [r.dataset.k]: +r.value } }, true); };
    });
  } else tiles(tabItems);
  if (tab === 'character') { const b = document.createElement('button'); b.className = 'tile import'; b.innerHTML = '<span>＋ Import SVG character…</span>'; b.onclick = () => $('svgFile').click(); tabbody.querySelector('.grid').appendChild(b); }
  thumbKey = ''; refreshThumbs(true);
}
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; buildTab(); });

function refreshThumbs(force) {
  const L = look(), key = JSON.stringify([tab, L]);
  if (!force && key === thumbKey) return; thumbKey = key;
  if (tab === 'design') return;
  tabbody.querySelectorAll('.tile[data-i]').forEach((b, i) => {
    const ch = tabItems[i].change, who = ch.character || L.who, style = ch.style || L.style, color = ch.style ? ch.color || null : L.color, pose = ch.pose || L.pose;
    const c2 = b.querySelector('canvas').getContext('2d');
    drawCharacter(c2, { ...BASE, ...POSES[pose] }, { ...STYLES[style], color }, 0.4, who);
    const on = (ch.character && ch.character === L.who) || (ch.pose && ch.pose === L.pose) || (ch.style && ch.style === L.style && (ch.color || null) === (L.color || null));
    b.setAttribute('aria-pressed', !!on);
  });
}

/* ----- render loop ----- */
function renderScoreAt(t) { const e = evaluate(C, t); drawCharacter(ctx, e.P, e.S, t, e.who); return e; }
let fc = 0;
function frame() {
  if (offline) return;
  let t = now(); if (t > dur()) { seek(0); t = 0; }
  let shownP, idx = -1;
  if (live) {
    const tw = performance.now() / 1000, target = { ...BASE, ...POSES[live.pose], ...live.set };
    for (const k in BASE) liveP[k] += (target[k] - liveP[k]) * .22;
    shownP = { ...liveP }; const bp = tw % 3.4; if (bp < .14) shownP.eyeOpen *= Math.abs(bp / .07 - 1);
    drawCharacter(ctx, shownP, { ...STYLES[live.style], color: live.color }, tw, live.character);
  } else {
    // paused: keep breathing/boiling on the wall clock so the frame never looks dead
    const e = evaluate(C, t); shownP = e.P; idx = e.idx;
    drawCharacter(ctx, e.P, e.S, playing ? t : t + (performance.now() / 1000 % 1000), e.who);
  }
  const line = lineOf[idx]; hl.hidden = line == null || !!live;
  if (line != null) hl.style.top = (10 + line * 18 - code.scrollTop) + 'px';
  scrub.value = Math.round(t / dur() * 1000);
  const bb = barBeat(t, .01);
  clock.textContent = `bar ${bb[0]} · beat ${Math.floor(bb[1])}   ${t.toFixed(1)}s`;
  if (++fc % 6 === 0) {
    refreshThumbs(false); if (playing) updateMode();
    if (tab === 'design') for (const k in BASE) { const r = $('sl-' + k); if (r && document.activeElement !== r) { r.value = shownP[k]; $('o-' + k).textContent = (+shownP[k]).toFixed(2); } }
  }
  requestAnimationFrame(frame);
}

/* ----- wiring ----- */
playBtn.onclick = () => setPlaying(!playing);
$('restart').onclick = () => { live = null; seek(0); updateMode(); };
scrub.oninput = () => { live = null; seek(scrub.value / 1000 * dur()); updateMode(); };
code.oninput = bpmEl.oninput = bpbEl.oninput = rebuild;
$('loadSong').onclick = () => {   // create/unlock audio inside the tap itself so phones allow playback
  try { song.ac = song.ac || new (window.AudioContext || window.webkitAudioContext)(); song.ac.resume(); } catch (_) {}
  $('audioFile').click();
};
$('svgFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  try {
    const name = f.name.replace(/\.svg$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'imported';
    CHARACTERS[name] = makeSvgCharacter(parseSvgRig(await f.text())); LABELS[name] = cap(name);
    rebuild(); buildTab(); act({ character: name }, true);
  } catch (x) { err.textContent = x.message; }
};
$('audioFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const btn = $('loadSong'); btn.textContent = 'Loading…'; err.textContent = '';
  try {
    if (!song.ac) song.ac = new (window.AudioContext || window.webkitAudioContext)();
    const data = await f.arrayBuffer();
    song.buf = await new Promise((ok, no) => { const r = song.ac.decodeAudioData(data, ok, no); if (r && r.then) r.then(ok, no); });
    songStop(); hasAudio = true; btn.textContent = '♪ ' + (f.name.length > 22 ? f.name.slice(0, 20) + '…' : f.name);
    playing = false; tPaused = 0; setPlaying(true);
  } catch (x) {
    btn.textContent = 'Load song';
    err.textContent = `Couldn't play "${f.name}". Try an MP3, M4A/AAC or WAV file. Songs bought from Apple Music or Spotify are copy-protected and can't be loaded.`;
  }
};
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });

code.value = DEFAULT_SCORE; rebuild(); buildTab(); updateMode(); requestAnimationFrame(frame);

// hook for the offline renderer (render.cjs): deterministic frame-by-frame export
window.RIG = { renderAt: t => { offline = true; renderScoreAt(t); }, duration: () => C.duration, canvas: cv };
</script>

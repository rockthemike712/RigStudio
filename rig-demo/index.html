<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rig Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a studio — script on the left, stage in the middle, control deck on the right (stacks on phones). */
  :root {
    --bg:#111216; --panel:#17181d; --raised:#1f2127; --line:#2b2d35; --text:#e3e4e8; --dim:#8a8d97;
    --accent:#ffc23d; --accent-ink:#1a1405; --rec:#ff6464; --hl:rgba(255,194,61,.16);
    --sans:'Inter', ui-sans-serif, system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 var(--sans); }
  #app { height:100%; display:grid; grid-template-rows:auto 1fr; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px; gap:10px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  header h1 { font-size:15px; font-weight:600; margin:0 10px 0 0; letter-spacing:.01em; }
  header h1 span { color:var(--accent); }
  button, select, input[type=number] { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:7px; padding:6px 11px; }
  button { cursor:pointer; }
  button:hover { border-color:#43464f; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, canvas:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  input[type=number] { width:62px; padding:6px 8px; }
  .lbl { color:var(--dim); font-size:12px; }
  #scrub { flex:1 1 160px; min-width:120px; accent-color:var(--accent); }
  #lipSens { width:90px; accent-color:var(--accent); }
  #meter { width:60px; height:16px; border-radius:3px; background:var(--raised); }
  #listenBtn[aria-pressed=false] { color:var(--dim); }
  #clock { font:12px var(--mono); color:var(--dim); min-width:150px; font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:minmax(260px, 30%) minmax(0, 1fr) 330px; gap:10px; min-height:0; }
  .pane { background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .pane-h { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; display:flex; justify-content:space-between; gap:8px; }
  #editorWrap { position:relative; flex:1; overflow:hidden; }
  #hl { position:absolute; left:0; right:0; height:18px; background:var(--hl); border-left:3px solid var(--accent); pointer-events:none; }
  #code { position:absolute; inset:0; width:100%; height:100%; resize:none; border:0; outline:0; background:transparent; color:var(--text);
          font:12px/18px var(--mono); padding:10px 12px; white-space:pre; tab-size:2; overflow:auto; }
  #err { color:var(--rec); padding:6px 12px; font:11.5px var(--mono); min-height:28px; border-top:1px solid var(--line); }
  #stage { display:flex; align-items:center; justify-content:center; padding:0; background:transparent; border:0; }
  #cv { width:100%; max-width:100%; max-height:100%; aspect-ratio:16/9; border-radius:10px; border:1px solid var(--line); }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:transparent; color:var(--dim); padding:9px 4px; border-bottom:2px solid transparent; }
  .tabs button[aria-selected=true] { color:var(--text); border-bottom-color:var(--accent); }
  .tabbody { flex:1; overflow:auto; padding:10px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .tile { padding:0; border-radius:8px; overflow:hidden; background:var(--raised); display:flex; flex-direction:column; text-align:left; }
  .tile canvas { width:100%; max-width:100%; aspect-ratio:300/216; display:block; }
  .tile span { padding:5px 8px; font-size:12px; color:var(--dim); }
  .tile[aria-pressed=true] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tile[aria-pressed=true] span { color:var(--text); }
  .lock { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; margin-bottom:12px; border:1px solid var(--line); border-radius:8px; background:var(--raised); cursor:pointer; }
  .lock input { margin-top:3px; accent-color:var(--accent); } .lock small { color:var(--dim); }
  #autoMood { padding:6px 8px; }
  .cat { display:flex; justify-content:space-between; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:14px 2px 8px; border-top:1px solid var(--line); padding-top:10px; }
  .cat:first-child { margin-top:2px; border-top:0; padding-top:0; }
  .tile.import { justify-content:center; align-items:center; min-height:96px; border-style:dashed; }
  fieldset { border:0; padding:0; margin:0 0 14px; display:grid; gap:6px; }
  legend { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
  .sl { display:grid; grid-template-columns:96px minmax(0, 1fr) 44px; align-items:center; gap:8px; font-size:12px; }
  .sl input { width:100%; accent-color:var(--accent); }
  .sl output { font:11px var(--mono); color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
  #deck { border-top:1px solid var(--line); padding:10px; display:grid; gap:8px; }
  .row.pos { align-items:center; gap:6px; flex-wrap:nowrap; }
  .row.pos button { flex:0 0 auto; padding:6px 13px; }
  .row.pos output { min-width:24px; text-align:center; font-variant-numeric:tabular-nums; font-weight:600; }
  .row.pos .lbl:last-of-type { margin-left:auto; }
  #mode { font-size:12px; color:var(--dim); }
  #mode b { color:var(--text); font-weight:600; }
  #mode.rec b { color:var(--rec); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { flex:1; }
  @media (max-width: 1100px) { main { grid-template-columns:minmax(0, 1fr) 320px; } #scriptPane { grid-column:1 / -1; grid-row:2; min-height:300px; } }
  @media (max-width: 720px) {
    html, body { height:auto; }
    #app { height:auto; }
    main { grid-template-columns:minmax(0, 1fr); }
    /* the stage pins to the top while you scroll through styles and poses, so every tap is visible */
    #stage { order:1; position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:6px; box-shadow:0 10px 14px -10px rgba(0,0,0,.7); }
    body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
    #panelPane { order:2; min-height:420px; overflow:visible; }
    /* preview buttons stay in reach at the bottom of the screen */
    #deck { position:sticky; bottom:env(safe-area-inset-bottom, 0px); z-index:4; background:var(--panel); border-radius:0 0 10px 10px; }
    #scriptPane { order:3; grid-column:auto; grid-row:auto; min-height:320px; }
    #clock { min-width:0; }
  }
  @media (prefers-reduced-motion: reduce) { #hl { transition:none; } }
</style>

<div id="app">
  <header>
    <h1>Rig <span>Studio</span></h1>
    <button id="play" class="primary">Play</button>
    <button id="restart" aria-label="Back to start">⟲</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="clock">bar 1 · beat 1</span>
    <label class="lbl" for="bpm">BPM</label><input id="bpm" type="number" value="100" min="30" max="240" step="0.1">
    <label class="lbl" for="bpb">Beats/bar</label><input id="bpb" type="number" value="4" min="1" max="12">
    <input id="audioFile" type="file" accept="audio/*,video/mp4,video/quicktime,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.mp4,.mov,.webm" hidden>
    <button id="loadSong">Load song</button>
    <canvas id="meter" width="120" height="32" hidden aria-label="What the character hears: vocals and beat"></canvas>
    <span id="songInfo" class="lbl" hidden></span>
    <button id="autoBtn" hidden>✨ Auto-animate</button>
    <select id="autoMood" hidden aria-label="Styles for auto-animate"><option value="mixed">Styles: follow the song</option><option value="keep">Styles: keep current</option><option value="calm">Styles: calm</option><option value="wild">Styles: wild</option></select>
    <label class="lbl" id="autoCamLbl" hidden><input type="checkbox" id="autoCam" checked> Camera moves</label>
    <label class="lbl" id="autoRoomLbl" hidden><input type="checkbox" id="autoRoom" checked> Rooms</label>
    <button id="listenBtn" hidden aria-pressed="true">Listening: on</button>
    <label class="lbl" id="lipLbl" for="lipSens" hidden title="How readily the mouth treats sound as words. Lower it if the mouth moves during instrumental parts.">Lip sync</label><input id="lipSens" type="range" min="0" max="1" step="0.05" value="0.5" hidden aria-label="Lip sync sensitivity">
    <input id="svgFile" type="file" accept=".svg,image/svg+xml" hidden>
  </header>
  <main>
    <section class="pane" id="scriptPane">
      <div class="pane-h"><span>Script</span><span>edits apply live</span></div>
      <div id="editorWrap"><div id="hl"></div><textarea id="code" spellcheck="false" aria-label="Animation script"></textarea></div>
      <div id="err"></div>
    </section>
    <section class="pane" id="stage"><canvas id="cv" width="1920" height="1080" aria-label="Character stage"></canvas></section>
    <section class="pane" id="panelPane">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="character" aria-selected="true">Character</button>
        <button role="tab" data-tab="style" aria-selected="false">Style</button>
        <button role="tab" data-tab="pose" aria-selected="false">Pose</button>
        <button role="tab" data-tab="room" aria-selected="false">Room</button>
        <button role="tab" data-tab="design" aria-selected="false">Design</button>
      </div>
      <div class="tabbody" id="tabbody"></div>
      <div id="deck">
        <div id="mode"></div>
        <div class="row pos" id="posRow" aria-label="Where in the song to add">
          <span class="lbl">Bar</span><button id="barDn" aria-label="Previous bar">‹</button><output id="barOut">1</output><button id="barUp" aria-label="Next bar">›</button>
          <span class="lbl">Beat</span><button id="beatDn" aria-label="Previous beat">‹</button><output id="beatOut">1</output><button id="beatUp" aria-label="Next beat">›</button>
        </div>
        <div class="row" id="liveBtns" hidden>
          <button id="addBtn" class="primary">Add to script</button>
          <button id="discardBtn">Back to script</button>
          <button id="wholeBtn" hidden>Use for whole song</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* =====================================================================
   RIG ENGINE
   Everything is a pure function of time:  frame = render(score, t)
   - CHARACTER: a parametric rig (numbers only, so anything can tween)
   - POSES:     named partial parameter sets
   - STYLES:    renderers that draw the same rig geometry differently
   - SCORE:     musical-time events { at:[bar, beat], ... } compiled to keyframes
   ===================================================================== */

const BASE = {
  bx:0, by:0, tilt:0, squash:1, zoom:1, camX:0, bounce:0,
  eyeOpen:1, eyeSize:20, eyeGap:48, lookX:0, lookY:0,
  browY:-78, browInner:0, browTilt:0, browW:1,
  mouthW:30, mouthCurve:8, mouthOpen:0, mouthY:18,
  lhX:-160, lhY:70, lhR:0, rhX:160, rhY:70, rhR:0, wave:0,
  // extra channels some characters use (others just ignore them)
  earL:0, earR:0, tailWag:1, tongue:0,
  // camera, body build, hand shapes
  camY:0, shake:0, bw:1, bh:1, handL:0, handR:0, eyeScale:1,
  // build & view: Doug is a real 3D box; Hashbrown maps these onto his 2D drawing
  bodyW:1, bodyH:1, bodyD:.42, seam:.5, yaw:18, pitch:8, lean:0, twist:0, eyeShape:0, headSize:1, handSize:1,
  // the 2.5D camera: dolly (push in > 0, pull out < 0), pan across the room, orbit round the character (degrees)
  dolly:0, pan:0, orbit:0,
};

const POSES = {
  neutral:   {},
  smiling:   { mouthCurve:16, mouthW:36, eyeOpen:.85, browY:-82, tailWag:1.6, tongue:.6 },
  waving:    { mouthCurve:14, rhX:175, rhY:-70, rhR:-20, wave:1, tilt:-3, earR:-10, tailWag:2 },
  thinking:  { lookX:9, lookY:-7, browTilt:10, mouthCurve:-2, mouthW:18, rhX:55, rhY:95, rhR:-35, tilt:4, earL:-14, earR:18, tailWag:.3 },
  laughing:  { eyeOpen:.18, mouthOpen:26, mouthCurve:16, mouthW:40, browY:-90, bounce:10, lhY:40, rhY:40, tongue:1, tailWag:2.5, earL:10, earR:-10 },
  suspicious:{ eyeOpen:.38, lookX:-10, browInner:10, browTilt:-6, mouthCurve:-4, mouthW:20, tilt:-5, bx:-15, earL:-18, earR:8, tailWag:0 },
  furious:   { eyeOpen:.7, eyeSize:17, browInner:22, browY:-70, mouthCurve:-12, mouthOpen:8, squash:.94, lhY:110, rhY:110, lhR:20, rhR:-20, earL:-30, earR:30, tailWag:0 },
  surprised: { eyeOpen:1.35, eyeSize:23, browY:-102, mouthOpen:22, mouthW:16, mouthCurve:0, squash:1.06, lhX:-175, lhY:-10, rhX:175, rhY:-10, earL:10, earR:-10 },
  sad:       { lookY:6, browInner:-14, browY:-74, mouthCurve:-14, mouthW:24, squash:.96, lhY:120, rhY:120, earL:-45, earR:45, tailWag:0 },
  happy:     { eyeOpen:.85, mouthOpen:13, mouthCurve:16, mouthW:34, browY:-84, tongue:1, tailWag:2.2, earL:4, earR:-4 },
  sleepy:    { eyeOpen:.12, browY:-72, mouthCurve:2, mouthW:14, tilt:8, squash:.97, lhY:120, rhY:120, earL:-30, earR:30, tailWag:.15 },
};

const allFills = color => ({ body: color, side: color, dark: color, eyeWhite: color, hand: color, fur: color, white: color, pink: color, iris: color });

/* ---------- the pose library (names follow the reference video) ----------
   Whole-body poses replace the previous pose. Poses marked layer:true (eyes-, mouth-, hand poses) are laid on top of it. */
// hand shapes: 0 mitten, 1 fist, 2 point, 3 five, 4 thumbs up, 5 two, 6 three, 7 palm up
Object.assign(POSES, {
  // attitudes
  'at-ease':  { tilt:-2, lookX:-3, mouthCurve:6, lhY:80, rhY:80 },
  selling:    { mouthCurve:18, mouthW:38, mouthOpen:8, eyeOpen:.9, browY:-86, rhX:150, rhY:10, rhR:-30, handR:7, tilt:-5, lookX:6 },
  doubtful:   { browTilt:12, mouthCurve:-4, mouthW:20, lookX:-8, lookY:-4, tilt:6, lhX:-120, lhY:90, handL:1 },
  alarmed:    { eyeOpen:1.4, eyeSize:23, browY:-104, mouthOpen:16, mouthW:18, mouthCurve:-4, squash:1.05, bx:-20, tilt:-6, lhX:-175, lhY:-20, rhX:175, rhY:-20, handL:3, handR:3, earL:12, earR:-12 },
  beaten:     { eyeOpen:.55, lookY:8, browInner:-16, mouthCurve:-12, squash:.92, tilt:5, lhY:130, rhY:130, earL:-45, earR:45, tailWag:0 },
  pleased:    { eyeOpen:.5, mouthCurve:18, mouthW:32, browY:-84, squash:1.03, tilt:-3, lhX:-140, lhY:60, rhX:140, rhY:60, handL:1, handR:1, tailWag:1.8 },
  fedup:      { eyeOpen:.45, browInner:6, mouthCurve:-6, mouthW:26, tilt:-4, lookX:6, lhX:-110, lhY:40, rhX:110, rhY:40, lhR:30, rhR:-30, handL:7, handR:7 },
  secret:     { yaw:-14, lookX:-10, eyeOpen:.7, mouthCurve:4, mouthW:14, mouthOpen:4, tilt:-8, bx:-25, rhX:60, rhY:20, rhR:-60, handR:3, earL:-8 },
  you:        { yaw:32, lookX:10, browY:-84, mouthCurve:12, tilt:4, rhX:185, rhY:20, rhR:-80, handR:2 },
  counting:   { lookY:-6, lookX:4, mouthCurve:4, browTilt:6, rhX:150, rhY:-10, handR:6, lhX:-150, lhY:60 },
  dunno:      { browY:-96, browInner:-10, mouthCurve:-8, mouthW:22, squash:.95, tilt:-3, lhX:-185, lhY:20, rhX:185, rhY:20, lhR:60, rhR:-60, handL:7, handR:7 },
  despair:    { eyeOpen:.3, browInner:-22, mouthOpen:10, mouthCurve:-14, squash:.9, tilt:10, lhX:-60, lhY:-40, rhX:60, rhY:-40, handL:3, handR:3, earL:-50, earR:50, tailWag:0 },
  deal:       { mouthCurve:16, eyeOpen:.8, browY:-86, lookX:6, rhX:170, rhY:40, rhR:-10, handR:4, tilt:-4, tailWag:1.5 },
  letter:     { lookX:6, lookY:6, mouthCurve:2, browTilt:4, lhX:-60, lhY:60, rhX:60, rhY:60, handL:1, handR:1, tilt:2 },
  // feelings
  'feel-happy':      { mouthCurve:18, mouthOpen:10, mouthW:36, eyeOpen:.75, browY:-88, bounce:6, tongue:.8, tailWag:2.2 },
  'feel-excited':    { eyeOpen:1.25, eyeSize:22, mouthOpen:20, mouthCurve:14, browY:-100, bounce:14, lhX:-170, lhY:-50, rhX:170, rhY:-50, handL:3, handR:3, tailWag:3, tongue:1 },
  'feel-furious':    { eyeOpen:.65, eyeSize:16, browInner:26, browY:-68, mouthCurve:-16, mouthOpen:10, squash:.92, lhY:100, rhY:100, handL:1, handR:1, earL:-40, earR:40, tailWag:0 },
  'feel-sulking':    { yaw:-8, eyeOpen:.5, lookX:-10, lookY:5, browInner:-6, mouthCurve:-10, mouthW:16, tilt:-7, lhX:-70, lhY:70, rhX:70, rhY:70, earL:-30, earR:30, tailWag:0 },
  'feel-flirting':   { eyeOpen:.55, lookX:8, browTilt:-8, mouthCurve:14, mouthW:22, tilt:7, bx:10, rhX:120, rhY:-10, rhR:-40, handR:3, tailWag:2 },
  'feel-bored':      { eyeOpen:.35, lookY:4, browY:-74, mouthCurve:-2, mouthW:18, tilt:9, squash:.97, lhY:120, rhY:120, earL:-20, earR:20, tailWag:.2 },
  'feel-terrified':  { eyeOpen:1.45, eyeSize:24, browInner:-20, browY:-104, mouthOpen:22, mouthW:20, mouthCurve:-10, squash:.94, bx:-30, lhX:-80, lhY:-10, rhX:80, rhY:-10, handL:3, handR:3, earL:-45, earR:45 },
  'feel-proud':      { pitch:-4, eyeOpen:.6, mouthCurve:12, browY:-88, squash:1.06, by:-6, tilt:-4, lhX:-120, lhY:40, rhX:120, rhY:40, lhR:40, rhR:-40, handL:1, handR:1, tailWag:1.5 },
  'feel-embarrassed':{ eyeOpen:.6, lookX:-10, lookY:6, browInner:-12, mouthCurve:4, mouthW:14, tilt:-8, squash:.96, lhX:-60, lhY:20, rhX:60, rhY:20, handL:3, handR:3 },
  'feel-laughing':   { eyeOpen:.15, mouthOpen:28, mouthCurve:18, mouthW:42, browY:-92, bounce:12, tilt:-6, lhY:40, rhY:40, tongue:1, tailWag:3 },
  'feel-crying':     { eyeOpen:.2, browInner:-24, mouthOpen:14, mouthCurve:-16, mouthW:26, squash:.94, lhX:-50, lhY:-20, rhX:50, rhY:-20, handL:1, handR:1, earL:-45, earR:45, tailWag:0 },
  'feel-plotting':   { eyeOpen:.45, lookX:-8, browInner:16, browTilt:-6, mouthCurve:10, mouthW:24, tilt:-5, lhX:-50, lhY:30, rhX:50, rhY:30, handL:3, handR:3, tailWag:.5 },
  // eyes (layered)
  'eyes-suspicious': { layer:true, eyeOpen:.38, lookX:-10, browInner:10 },
  'eyes-sad':        { layer:true, eyeOpen:.7, lookY:6, browInner:-16 },
  'eyes-sleepy':     { layer:true, eyeOpen:.2, browY:-72 },
  'eyes-furious':    { layer:true, eyeOpen:.65, browInner:24, browY:-70 },
  'eyes-wide':       { layer:true, eyeOpen:1.4, browY:-102 },
  'eyes-happy':      { layer:true, eyeOpen:.18, mouthCurve:12 },
  // mouths (layered)
  'mouth-gasp':      { layer:true, mouthOpen:22, mouthW:16, mouthCurve:0 },
  'mouth-happy':     { layer:true, mouthCurve:18, mouthW:36, mouthOpen:6 },
  'mouth-smirk':     { layer:true, mouthCurve:10, mouthW:22, browTilt:8 },
  'mouth-oo':        { layer:true, mouthOpen:10, mouthW:10, mouthCurve:0 },
  'mouth-flat':      { layer:true, mouthCurve:0, mouthOpen:0, mouthW:24 },
  // hands (layered)
  count1:    { layer:true, rhX:150, rhY:-20, rhR:0, handR:2 },
  count2:    { layer:true, rhX:150, rhY:-20, rhR:0, handR:5 },
  count3:    { layer:true, rhX:150, rhY:-20, rhR:0, handR:6 },
  count4:    { layer:true, rhX:150, rhY:-20, rhR:0, handR:3 },
  shrug:     { layer:true, lhX:-185, lhY:20, rhX:185, rhY:20, lhR:60, rhR:-60, handL:7, handR:7, browY:-94 },
  'point-you':{ layer:true, rhX:185, rhY:30, rhR:-85, handR:2 },
  thumbsup:  { layer:true, rhX:165, rhY:20, rhR:0, handR:4 },
  wave:      { layer:true, rhX:175, rhY:-70, rhR:-20, wave:1, handR:3 },
  fist:      { layer:true, handL:1, handR:1 },
  stop:      { layer:true, rhX:170, rhY:0, rhR:0, handR:3 },
  facepalm:  { layer:true, rhX:30, rhY:-40, rhR:-20, handR:3, eyeOpen:.2 },
});

/* ---------- rooms & the 2.5D camera ----------
   A room is a paper diorama: a floor and walls in real perspective, 3D boxes for furniture and buildings, and flat
   cut-out cards standing at different depths. Everything is drawn with the style's own pen, so every room works in
   every style. The camera can push in, pull out, pan and orbit; near things slide further than far ones (parallax),
   boxes show their sides, and Doug turns for real. */
const CAM_D = 700;
// room surfaces are big: hand-drawn textures (crayon scribble, hatching, halftone) over a whole wall cost ~100 ms a frame,
// so rooms get each fill's flat colour instead, like a painted animation background behind a fully textured character
const _roomFills = new WeakMap();
function roomFills(F) {
  if (!F) return F; if (_roomFills.has(F)) return _roomFills.get(F);
  const out = {};
  for (const [k, c] of Object.entries(F)) out[k] = !c || typeof c !== 'object' || c.grad || c.foil ? c
    : c.base ? c.base : { flat: c.scribble || c.hatch || c.spray || c.dots || (c.stripes && c.stripes[0]) || 'rgba(0,0,0,0)', a: c.spray ? .9 : .4 };
  _roomFills.set(F, out); return out;
}                                   // camera distance to the character, in world units
const floorOf = who => who === 'fridge' || CAST[who] ? 141 : 203;   // where each character's feet meet the floor
const camOf = P => { const th = (P.orbit || 0) * Math.PI / 180, zoom = P.zoom || 1;
  // a push-in on top of a close-up would end up inside the character's nose: cap the combined magnification
  const f = Math.min(1 / (1 - .42 * Math.max(-1.2, Math.min(1.5, P.dolly || 0))), Math.max(1, 2.1 / zoom));
  return { c: Math.cos(th), s: Math.sin(th), dc: CAM_D / f, pan: P.pan || 0, camY: P.camY || 0 }; };
const MOVE_NAMES = { still: 'Still', push: 'Push in', pull: 'Pull out', pan: 'Pan across', orbit: 'Orbit', drift: 'Drift', sweep: 'Sweep in' };
function moveAt(name, el, len) {   // a camera move, el seconds after it started; len = the move's length (2 bars)
  const u = Math.max(0, Math.min(1, el / len)), sm = u * u * (3 - 2 * u), Z = { dolly: 0, pan: 0, orbit: 0 };
  switch (name) {
    case 'push': return { ...Z, dolly: sm * .95 };
    case 'pull': return { ...Z, dolly: .95 - 1.35 * sm };
    case 'pan': { const v = Math.max(0, Math.min(1, el / (len * 1.5))); return { ...Z, pan: -150 + 300 * v * v * (3 - 2 * v), dolly: .15 }; }
    case 'orbit': return { ...Z, orbit: 24 * Math.sin(el * TAU / (len * 2)), dolly: .18 };
    case 'drift': return { orbit: 7 * Math.sin(el * .45), pan: 35 * Math.sin(el * .31), dolly: .1 + .08 * Math.sin(el * .23) };
    case 'sweep': return { ...Z, orbit: -22 * (1 - sm), dolly: .7 * sm - .2, pan: 90 * (1 - sm) };
  }
  return Z;
}

function makeRoom(ctx, pen, S, cam, fy, t) {
  const items = [], NEAR = -cam.dc * .72;
  const rot = ([x, y, z]) => [x * cam.c - z * cam.s, fy + y, x * cam.s + z * cam.c];
  const scr = ([xr, y, zr]) => { const f = CAM_D / (cam.dc + zr); return [f * (xr - cam.pan), f * (y + cam.camY)]; };
  const clip = Q => { const out = []; for (let i = 0; i < Q.length; i++) { const a = Q[i], b = Q[(i + 1) % Q.length], ia = a[2] >= NEAR, ib = b[2] >= NEAR;
    if (ia) out.push(a); if (ia !== ib) { const u = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, NEAR]); } } return out; };
  const poly = pts => clip(pts.map(rot)).map(scr);
  const depthOf = (x, z) => x * cam.s + z * cam.c;
  const eye = [cam.pan, -cam.camY, -cam.dc];          // the camera, in rotated world space
  const pink = typeof (S.fills && S.fills.pink) === 'string' && !/^(BG|INK)$/.test(S.fills.pink) ? S.fills.pink : null;
  const R = {
    t, S, pen, ctx, fy, pink,
    above: y => -cam.camY < fy + y,                   // is the camera looking down on this height?
    plane(pts, role, k = .7) { const q = poly(pts); if (q.length < 3) return; if (role) pen.fill(q, role); if (k) pen.stroke(q, true, k); },
    tint(pts, a = .07, col) { const q = poly(pts); if (q.length < 3) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col || pen.ink; ctx.beginPath();
      q.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.fill(); ctx.restore(); },
    line(pts, k = .5, closed = false) {   // a 3D polyline; pieces behind the camera are dropped
      const r = pts.map(rot); let run = [];
      const flush = () => { if (run.length > 1) pen.stroke(run.map(scr), false, k); run = []; };
      for (let i = 0; i < r.length + (closed ? 1 : 0); i++) { const p = r[i % r.length]; if (p[2] < NEAR) flush(); else run.push(p); }
      flush();
    },
    rect(x0, y0, x1, y1, z, k = .5, role) { const q = [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]; if (role) R.plane(q, role, k); else R.line(q, k, true); },
    floorEllipse(cx, cz, rx, rz, n = 36) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push([cx + Math.cos(a) * rx, 0, cz + Math.sin(a) * rz]); } return p; },
    box(x0, x1, y0, y1, z0, z1, o = {}) {   // a real 3D box: only the faces that face the camera are drawn
      items.push({ z: depthOf((x0 + x1) / 2, (z0 + z1) / 2), far: o.far, fn: () => {
        const F = [[[[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], [0, 0, -1], o.front ?? 'white', 'front'],
                   [[[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], [1, 0, 0], o.side ?? 'side', 'right'],
                   [[[x0, y0, z1], [x0, y0, z0], [x0, y1, z0], [x0, y1, z1]], [-1, 0, 0], o.side ?? 'side', 'left'],
                   [[[x0, y0, z1], [x1, y0, z1], [x1, y0, z0], [x0, y0, z0]], [0, -1, 0], o.top ?? 'white', 'top']];
        const seen = {};
        for (const [q, n, role, name] of F) {
          const c = rot([q.reduce((s, p) => s + p[0], 0) / 4, q.reduce((s, p) => s + p[1], 0) / 4, q.reduce((s, p) => s + p[2], 0) / 4]);
          const nr = [n[0] * cam.c - n[2] * cam.s, n[1], n[0] * cam.s + n[2] * cam.c];
          if (nr[0] * (eye[0] - c[0]) + nr[1] * (eye[1] - c[1]) + nr[2] * (eye[2] - c[2]) <= 0) continue;
          seen[name] = 1; R.plane(q, role, o.k ?? .75);

    },
    card(x, z, fn, o = {}) {   // a flat cut-out standing on the floor at (x, z); o.y lifts it, o.face keeps it square to the camera
      items.push({ z: depthOf(x, z), far: o.far, fn: () => {
        const y = o.y || 0, O = rot([x, y, z]); if (O[2] < NEAR + 20) return;
        const o0 = scr(O), ex = scr(o.face ? [O[0] + 1, O[1], O[2]] : rot([x + 1, y, z])), ey = scr(rot([x, y + 1, z]));
        ctx.save(); ctx.transform(ex[0] - o0[0], ex[1] - o0[1], ey[0] - o0[0], ey[1] - o0[1], o0[0], o0[1]); fn(pen, ctx, R); ctx.restore();
      } });
    },
    later(x, z, fn, far) { items.push({ z: depthOf(x, z), far, fn }); },   // anything else, sorted by depth
    walls(B, side = 1500, o = {}) {   // floor + back wall + side-wall corners
      R.tint([[-3500, 0, NEAR / cam.c - 400], [3500, 0, NEAR / cam.c - 400], [3500, 0, B], [-3500, 0, B]], o.floorTint ?? .07);
      if (o.wallTint) R.tint([[-3500, -2600, B], [3500, -2600, B], [3500, 0, B], [-3500, 0, B]], o.wallTint);
      R.line([[-side, 0, B], [side, 0, B]], .7);
      for (const sx of [-side, side]) { R.line([[sx, 0, B], [sx, -2600, B]], .6); R.line([[sx, 0, B], [sx, 0, -900]], .6); }
      if (o.baseboard) R.line([[-side, -o.baseboard, B - 1], [side, -o.baseboard, B - 1]], .4);
    },
    dots(n, z, spread, seed = 1, size = 4, ys = [-2600, -300]) { for (let i = 0; i < n; i++) { const x = (rnd(i, seed) - .5) * spread, y = ys[0] + rnd(i, seed + 1) * (ys[1] - ys[0]);
      R.card(x, z, (pn, c) => { c.fillStyle = pn.ink; c.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * 1.3 + i)); c.fillRect(-size / 2, -size / 2, size, size); }, { y, face: true, far: true }); } },
  };
  return {
    R,
    // draw what's behind the character, with atmospheric fade so far things sit back
    back(fade = true) {
      items.sort((a, b) => b.z - a.z);
      const veil = a => { if (!fade) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.fillStyle = S.bg; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height); ctx.restore(); };
      const far = items.filter(q => q.z >= 0 && (q.far || q.z > 1100)), mid = items.filter(q => q.z >= 0 && !(q.far || q.z > 1100));
      far.forEach(q => q.fn()); veil(.22); mid.forEach(q => q.fn()); veil(.12);
    },
    front() { items.filter(q => q.z < 0).forEach(q => q.fn()); },
  };
}

/* ----- live puppeting ----- */
function enterLive() {
  if (live) return;
  const e = evaluate(C, now());
  live = { character: e.who, style: e.styleName, color: e.S.color, color2: e.S.color2 || null, pose: e.pose, room: e.room, move: e.move, moveT: performance.now() / 1000, set: {} };

}

    if (!commit) return;
    insertEvent(barBeat(now(), .5), change); flashMode(); return;
  }
  enterLive();
  if (change.character) live.character = change.character;
  if (change.style) { live.style = change.style; live.color = change.color || null; live.color2 = change.color2 || null; }
  if (change.pose) { if (POSES[change.pose].layer) live.set = { ...live.set, ...poseParams(change.pose) }; else { live.pose = change.pose; live.set = {}; } }
  if (change.set) live.set = { ...live.set, ...change.set };
  if (change.room) live.room = change.room;
  if (change.move) { live.move = change.move; live.moveT = performance.now() / 1000; }
  updateMode(); refreshThumbs(true);
}
function liveDiff() {
  const d = {};
  if (live.character !== liveBase.character) d.character = live.character;
  if (live.style !== liveBase.style || live.color !== liveBase.color) { d.style = live.style; if (live.color) d.color = live.color; if (live.color2) d.color2 = live.color2; }
  if (live.pose !== liveBase.pose) d.pose = live.pose;
  if (live.room !== liveBase.room) d.room = live.room;
  if (live.move !== liveBase.move) d.move = live.move;
  if (Object.keys(live.set).length) d.set = live.set;
  return d;
}
// choosing where an edit lands: step the playhead by bars or beats from the deck (no need to reach the timeline)
function gotoBeat(total) { total = Math.max(0, total); seek(beatOffset() + total * spb()); updateMode(); }
function stepBeats(n) { const [bar, beat] = barBeat(now(), 1); gotoBeat((bar - 1) * bpb() + Math.round(beat) - 1 + n); }
$('barDn').onclick = () => stepBeats(-bpb()); $('barUp').onclick = () => stepBeats(bpb());
$('beatDn').onclick = () => stepBeats(-1); $('beatUp').onclick = () => stepBeats(1);
addBtn.onclick = () => {
  let d = liveDiff(); if (!Object.keys(d).length) d = { pose: live.pose };   // same as the script here: still write it, so it holds from this beat
  insertEvent(barBeat(now(), 1), d); live = null;
  stepBeats(1);   // move on a beat, so the next change lands after this one
};
$('wholeBtn').onclick = () => { if (!live) return; const id = live.character; live = null; starLock = true; setStar(id); buildTab(); };
$('discardBtn').onclick = () => { live = null; updateMode(); refreshThumbs(true); };
let flashUntil = 0;
function flashMode() { flashUntil = performance.now() + 700; updateMode(); setTimeout(updateMode, 720); }
function updateMode() {
  const at = barBeat(now(), playing ? .5 : 1);
  modeEl.className = playing ? 'rec' : '';
  if (playing) modeEl.innerHTML = performance.now() < flashUntil ? `<b>● Recorded</b> at bar ${at[0]}, beat ${at[1]}` : `<b>● Performing</b> · clicks are written into the script on the beat`;
  else if (live) modeEl.innerHTML = `<b>Previewing</b> · not in the script yet`;
  else modeEl.innerHTML = `<b>Paused</b> at bar ${at[0]}, beat ${at[1]} · click anything to preview it`;
  liveBtns.hidden = !live;
  if (live) addBtn.textContent = `Add at bar ${at[0]}, beat ${at[1]}`;
  $('wholeBtn').hidden = !live || live.character === liveBase.character;
  $('posRow').hidden = playing; const pb = barBeat(now(), 1); $('barOut').textContent = pb[0]; $('beatOut').textContent = Math.round(pb[1]);

/* ----- panels ----- */
function look() { // what's on stage right now
  if (live) return { who: live.character, style: live.style, color: live.color, color2: live.color2, pose: live.pose, room: live.room, move: live.move, set: live.set };
  const e = evaluate(C, now()); return { who: e.who, style: e.styleName, color: e.S.color, color2: e.S.color2, pose: e.pose, room: e.room, move: e.move, set: {} };
}
function tiles(items) {   // tiles grouped under category headings, like the reference panel
  const groups = []; items.forEach((it, i) => { const g = groups[groups.length - 1]; if (!g || g.cat !== it.cat) groups.push({ cat: it.cat, list: [[it, i]] }); else g.list.push([it, i]); });
  tabbody.innerHTML = groups.map(g => `${g.cat ? `<div class="cat"><span>${g.cat}</span><span>${g.list.length}</span></div>` : ''}<div class="grid">${g.list.map(([it, i]) =>
    `<button class="tile" data-i="${i}" aria-pressed="false"><canvas width="300" height="216"></canvas><span>${it.label}</span></button>`).join('')}</div>`).join('');
  tabbody.querySelectorAll('.tile[data-i]').forEach(b => b.onclick = () => act(items[+b.dataset.i].change));
}
let tabItems = [];
function buildTab() {

  if (tab === 'character') { const ids = Object.keys(CHARACTERS), grp = id => CAST[id] ? 1 : id.startsWith('hashbrown-') ? 2 : 0, cats = ['Characters', "Doug's cast", "Hashbrown's builds"];
    tabItems = [0, 1, 2].flatMap(g => ids.filter(id => grp(id) === g)).map(c => ({ cat: cats[grp(c)], label: LABELS[c] || cap(c), change: { character: c } })); }

  if (tab === 'room') tabItems = [...ROOM_LIST.map(([id, label]) => ({ cat: 'Rooms', label, change: { room: id } })),

  if (tab === 'pose') tabItems = POSE_CATS.flatMap(([cat, list]) => list.filter(q => POSES[q]).map(q => ({ cat, label: cap((q.startsWith('feel-') ? q.slice(5) : q).replace(/-/g, ' ')), change: { pose: q } })));
  if (tab === 'design') {
    tabItems = [];
    tabbody.innerHTML = Object.entries(SLIDERS).map(([g, list]) => `<fieldset><legend>${g}</legend>${list.map(([k, l, a, b, st]) =>
      `<label class="sl"><span>${l}</span><input type="range" id="sl-${k}" data-k="${k}" min="${a}" max="${b}" step="${st}"><output id="o-${k}"></output></label>`).join('')}</fieldset>`).join('');

    lock.innerHTML = `<input type="checkbox" id="lockChk" ${starLock ? 'checked' : ''}> <span><b>One character for the whole song</b><br><small>${starLock ? 'Tap a character to make it the star. Script switches are ignored.' : 'The script decides: tap to preview, then Add to switch at that beat.'}</small></span>`;
    tabbody.prepend(lock); $('lockChk').onchange = e => { starLock = e.target.checked; if (starLock) star = look().who; rebuild(); buildTab(); updateMode(); };
  }
  if (tab === 'character') { const b = document.createElement('button'); b.className = 'tile import'; b.innerHTML = '<span>＋ Import SVG character…</span>'; b.onclick = () => $('svgFile').click(); tabbody.querySelector('.grid').appendChild(b); }
  tabbody.scrollTop = 0; refreshThumbs(true);
}
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; buildTab(); });

function refreshThumbs(force) {   // draws only tiles on screen, a few per call, so 100+ styles stay smooth
  if (tab === 'design') return;
  const L = look(), base = JSON.stringify(L), vh = innerHeight || 800; let budget = force ? 10 : 5;
  tabbody.querySelectorAll('.tile[data-i]').forEach(b => {
    const i = +b.dataset.i, ch = tabItems[i].change;
    const on = (ch.character && ch.character === L.who) || (ch.pose && ch.pose === L.pose) || (ch.room && ch.room === L.room) || (ch.move && ch.move === L.move) || (ch.style && ch.style === L.style && (ch.color || null) === (L.color || null));

    const r = b.getBoundingClientRect(); if (r.bottom < -150 || r.top > vh + 150 || r.width === 0) return;
    const tk = base + '|' + i + '|' + tab; if (b.dataset.k === tk || budget-- <= 0) return; b.dataset.k = tk;
    const who = ch.character || L.who, style = ch.style || L.style, color = ch.style ? ch.color || null : L.color, color2 = ch.style ? ch.color2 || null : L.color2;
    const layered = ch.pose && POSES[ch.pose].layer, P = { ...BASE, ...poseParams(ch.pose && !layered ? ch.pose : L.pose), ...(L.set || {}), ...(layered ? poseParams(ch.pose) : {}) };
    if (ch.move) { const m = moveAt(ch.move, 6, 8); for (const k in m) P[k] += m[k]; }   // a camera move's tile shows it part-way through
    drawCharacter(b.querySelector('canvas').getContext('2d'), P, { ...STYLES[style], color, color2: color2 || STYLES[style].color2, room: ch.room || L.room }, 0.4, who);
  });
}
tabbody.addEventListener('scroll', () => refreshThumbs(false), { passive: true });
addEventListener('scroll', () => refreshThumbs(false), { passive: true });

/* ----- render loop ----- */
function renderScoreAt(t) { const e = evaluate(C, t); drawScene(ctx, react(e.P, t), e.S, t, e.who, e.grid, e.styleName); return e; }
let fc = 0;
function frame() {
  if (offline) return;
  let t = now(); if (t > dur()) { seek(0); t = 0; }
  let shownP, idx = -1;
  if (live) {
    const tw = performance.now() / 1000, target = { ...BASE, ...POSES[live.pose], ...live.set };
    for (const k in BASE) liveP[k] += (target[k] - liveP[k]) * .22;
    shownP = { ...liveP }; const bp = tw % 3.4; if (bp < .14) shownP.eyeOpen *= Math.abs(bp / .07 - 1);
    const m = moveAt(live.move, tw - live.moveT, 2 * bpb() * spb()); for (const k in m) shownP[k] += m[k];
    drawCharacter(ctx, shownP, { ...STYLES[live.style], color: live.color, color2: live.color2 || STYLES[live.style].color2, room: live.room }, tw, live.character);
  } else {
    // paused: keep breathing/boiling on the wall clock so the frame never looks dead
    const e = evaluate(C, t); shownP = react(e.P, t); idx = e.idx;
    drawScene(ctx, shownP, e.S, playing ? t : t + (performance.now() / 1000 % 1000), e.who, e.grid, e.styleName);
  }
  if (song.an) drawMeter(t);
  const line = lineOf[idx]; hl.hidden = line == null || !!live;
  if (line != null) hl.style.top = (10 + line * 18 - code.scrollTop) + 'px';
  scrub.value = Math.round(t / dur() * 1000);
  const bb = barBeat(t, .01);
  clock.textContent = `bar ${bb[0]} · beat ${Math.floor(bb[1])}   ${t.toFixed(1)}s`;
  if (++fc % 6 === 0) {
    refreshThumbs(false); if (playing) updateMode();
    if (tab === 'design') for (const k in BASE) { const r = $('sl-' + k); if (r && document.activeElement !== r) { r.value = shownP[k]; $('o-' + k).textContent = (+shownP[k]).toFixed(2); } }
  }
  requestAnimationFrame(frame);
}

/* ----- wiring ----- */
// iPhone/iPad: Web Audio is muted by the silent switch. A looping silent <audio> element started inside the tap

const SILENT_WAV = 'data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI let unmuteEl = null;
function iosUnmute() {
  try {
    if (!unmuteEl) { unmuteEl = document.createElement('audio'); unmuteEl.setAttribute('playsinline', ''); unmuteEl.setAttribute('x-webkit-airplay', 'deny'); unmuteEl.loop = true; unmuteEl.preload = 'auto'; unmuteEl.src = SILENT_WAV; }
    const p = unmuteEl.play(); if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}
function unlockAudio() {
  iosUnmute();

    song.ac = song.ac || new (window.AudioContext || window.webkitAudioContext)(); song.ac.resume();
    const b = song.ac.createBuffer(1, 1, 22050), s = song.ac.createBufferSource(); s.buffer = b; s.connect(song.ac.destination); s.start(0);
  } catch (_) {}
}
playBtn.onclick = () => { if (hasAudio) unlockAudio(); setPlaying(!playing); };
$('restart').onclick = () => { live = null; seek(0); updateMode(); };
scrub.oninput = () => { live = null; seek(scrub.value / 1000 * dur()); updateMode(); };
code.oninput = bpmEl.oninput = bpbEl.oninput = rebuild;
$('loadSong').onclick = () => {   // create/unlock audio inside the tap itself so phones allow playback

};
$('svgFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  try {
    const name = f.name.replace(/\.svg$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'imported';
    CHARACTERS[name] = makeSvgCharacter(parseSvgRig(await f.text())); LABELS[name] = cap(name);
    rebuild(); buildTab(); act({ character: name }, true);
  } catch (x) { err.textContent = x.message; }
};
$('audioFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

    if (!song.ac) song.ac = new (window.AudioContext || window.webkitAudioContext)();

function runAuto(newTake) {   // each press is a new take; the options are read every time

  code.value = autoScript(song.name || 'song', { mood: $('autoMood').value, camera: $('autoCam').checked, rooms: $('autoRoom').checked, take: autoTake }); rebuild(); code.scrollTop = 0; live = null; seek(0); updateMode();
}
$('autoBtn').onclick = () => runAuto(true);
